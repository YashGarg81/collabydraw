# docker-compose.yml
version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:your_secure_password@database:5432/collabydraw
      - JWT_SECRET=your_secret_here
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
    depends_on:
      - websocket
      - database

  websocket:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.websocket
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:your_secure_password@database:5432/collabydraw
      - JWT_SECRET=your_secret_here
      - REDIS_URL=redis://redis:6379
    depends_on:
      - database
      - redis

  database:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: collabydraw
      POSTGRES_PASSWORD: your_secure_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: collabydraw_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres-data:
  redis_data: